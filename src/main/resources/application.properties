# Defaults for local POC. Newer models (e.g. Claude 4.x) need an inference profile ARN or
# profile id — see README.
aws.region=us-east-1
aws.profile=default

# Active model (env BEDROCK_MODEL_ID overrides this line).
# On-demand-friendly default:
# bedrock.model.id=anthropic.claude-3-5-sonnet-20241022-v2:0
#
# For Claude Sonnet 4.6 via inference profile, comment the line above and uncomment ONE of:
#bedrock.model.id=arn:aws:bedrock:us-east-1:406205545357:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0
bedrock.model.id=arn:aws:bedrock:us-east-1:406205545357:inference-profile/global.anthropic.claude-sonnet-4-6
# bedrock.model.id=arn:aws:bedrock:us-east-1:406205545357:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0
# bedrock.model.id=global.anthropic.claude-sonnet-4-6

anthropic.max_tokens=4096
anthropic.temperature=0

# --- LLM transport ---
# How the video-to-goal path and the Stage 1 eval reach Claude:
#   bedrock = call Bedrock Runtime directly with local AWS credentials (default)
#   proxy   = call the SailPoint GenAI gateway
# Env LLM_PROVIDER overrides this line. Every other path (agent loop, aggregation,
# replay) stays on Bedrock regardless of this setting.
# llm.provider=proxy

llm.provider=bedrock

# Tenant API root for the gateway (env LLM_PROXY_BASE_URL overrides). Must be https.
llm.proxy.base.url=https://hworg.api.cloud.sailpoint.com

# Gateway credentials (personal access token pair).
#
# WARNING: this file is tracked in git, so a secret typed here will be committed.
# Before filling in the secret, tell git to ignore your local edits:
#   git update-index --skip-worktree src/main/resources/application.properties
# Or leave both blank and export them instead, which always takes precedence:
#   export LLM_PROXY_CLIENT_ID=...
#   export LLM_PROXY_CLIENT_SECRET=...
llm.proxy.client.id=844513e38892471cbf1dd29bbd792fe3
llm.proxy.client.secret=3654a0ba52f23fcdc307c30f626fb0cb059d2ad5aaef8f9cffc17a133d3c535e

# Inference profile the gateway should target (env LLM_PROXY_MODEL_ID overrides).
# Note this is a different region and prefix from bedrock.model.id above
# (us-west-2 / us. rather than us-east-1 / global.).
llm.proxy.model.id=arn:aws:bedrock:us-west-2:406205545357:inference-profile/us.anthropic.claude-sonnet-4-6

# The gateway is submit-then-poll. An 80-frame video analysis has taken up to two
# minutes end to end, so the poll budget is set well clear of that.
llm.proxy.connect.timeout.ms=10000
llm.proxy.request.timeout.ms=180000
llm.proxy.poll.interval.ms=2000
llm.proxy.poll.timeout.ms=300000

# --- Agent settings ---
agent.max_steps=40

# JSONL action outcome log (set to none to disable)
agent.log.file=./agent-run.jsonl

# Consecutive no-progress steps before stuck-warning is injected into history
agent.no_progress_limit=3

# Multi-viewport screenshot tiling (top→bottom slices) on page-shape-changing
# observations (initial load, GOTO, RELOAD_PAGE) so the LLM sees a tall page
# (long forms) in one observation. Set to 1 to disable and use single-viewport
# screenshots only. Default 6 balances visibility with token cost.
agent.multi.viewport.max.frames=6

# --- Browser ---
browser.headless=false
browser.slow_mo_ms=0

# Maximise the window on headed runs; use fullscreen.width/height for headless.
browser.start.maximized=true
browser.fullscreen.width=1920
browser.fullscreen.height=1080

# --- Screenshot optimization ---
# format: jpeg (smaller, ~40-80 KB) or png (lossless, ~200-400 KB)
screenshot.format=jpeg
# JPEG quality 0-100 — 70 is a good balance of clarity vs token cost
screenshot.jpeg.quality=70

# Viewport size (used when start.maximized=false)
browser.viewport.width=1024
browser.viewport.height=640

# --- Per-action timeouts ---
browser.action.timeout.click.ms=8000
browser.action.timeout.type.ms=5000
browser.action.timeout.navigate.ms=90000

# Inter-action delay upper bound (ms). 0 = no delay. >0 = random jitter up to this value
# between each action, introducing human-like pacing.
browser.inter.action.delay.ms=0

# --- Video frame extraction (for runVideo task) ---
# Maximum number of frames to extract from video
video.max.frames=80
# Minimum pixel change percentage (0.02 = 2%) to consider a frame significant
video.change.threshold=0.02
# Minimum time gap (seconds) between extracted frames
video.min.gap.seconds=0.5
# Maximum time gap (seconds) before a frame is force-kept regardless of pixel change.
# This ensures subtle UI actions (checkbox toggles, radio buttons, small highlights) are
# captured even when the overall screen change is below the threshold. Default: 3.0s
video.max.forced.gap.seconds=3.0
# Maximum frame width (pixels) before proportional downscaling. Reduces both the HTTP payload
# sent to Bedrock and Claude token cost (tokens scale with pixel count). 0 = no resize.
video.frame.max.width=1280
# JPEG quality for encoded video frames (1-100). 75 balances legibility with payload size.
# Replaces the previous lossless PNG encoding (~90% smaller per frame at quality 75).
video.jpeg.quality=75
# Directory to save debug frames (leave blank to disable)
video.debug.frames.dir=/Users/amol.palwe/Desktop/DisconnectedApps/ui-agent-bedrock-poc/src/main/resources/Frames

# --- Grid-based frame analysis (REQ-FS) ---
video.grid.size=12
video.grid.cell.threshold=0.08
video.score.weight.breadth=0.4
video.score.weight.intensity=0.4
video.score.weight.presence=0.2
video.zone.weight.url_bar=3.0
video.zone.weight.main_content=2.0
video.zone.weight.left_nav=0.5
video.zone.weight.right_sidebar=0.5
video.zone.weight.bottom_bar=0.5
video.pattern.nav.spike.threshold=0.5
video.pattern.nav.stable.bonus=2.5
video.pattern.nav.spike.penalty=0.3
video.pattern.typing.max.cells=3
video.pattern.typing.max.cell.change=0.05
video.pattern.typing.min.frames=3
video.pattern.typing.end.bonus=2.0
video.pattern.typing.mid.penalty=0.2
video.pattern.animation.window=5
video.pattern.animation.variance.threshold=0.20
video.pattern.animation.min.frames=4
video.pattern.animation.penalty=0.1
video.pattern.element.min.cluster.size=4
video.pattern.element.persist.frames=2
video.pattern.element.bonus=2.0
video.pattern.scroll.threshold=0.3
video.pattern.scroll.end.bonus=1.5
video.pattern.scroll.mid.penalty=0.3
video.selection.max.gap.seconds=8.0
video.selection.similarity.threshold=0.92
video.url.bar.mandatory.threshold=0.30
# Minimum seconds between two non-mandatory frames during greedy selection (temporal non-max
# suppression). Prevents one busy moment from consuming the whole frame budget. 0 disables.
video.selection.min.gap.seconds=0.5

# --- Pre-flight relevance triage ---
# Classifies the uploaded video before the expensive step-generation call and rejects
# recordings that cannot yield meaningful steps (camera footage, terminals, static pages).
video.relevance.enabled=true
# Frames sampled from the already-extracted set and shown to the classifier.
video.relevance.sample.frames=8
# Model used for triage. Blank falls back to bedrock.model.id. A cheaper vision model is
# usually enough, though domain judgement degrades most on smaller models.
video.relevance.model.id=
video.relevance.max.tokens=512
# Reject only at or above this confidence (0-100). Below it the video is accepted with a
# warning, because a false reject blocks the user while a false accept is caught later.
video.relevance.min.confidence=75
# Whether a real but consumer-facing web app (shopping, social, webmail) is rejected outright
# or only flagged. Such recordings are structurally analysable, so the default is to flag.
video.relevance.reject.out.of.domain=false

# --- Record / Replay scripts (REQ-RR) ---
script.output.dir=./output/scripts

# --- Replay scroll strategies (REQ-SIV) ---
replay.scroll.settle.ms=300
replay.progressive.scroll.chunk.px=400
replay.progressive.scroll.max.chunks=15
replay.progressive.scroll.chunk.wait.ms=250

# --- Account Aggregation ---
# Maximum number of table pages to scrape before stopping (safety ceiling)
aggregation.max.pages=100
# Directory where CSV output files are written (created automatically if missing)
aggregation.output.dir=./output

# ── Aggregation Mode ──────────────────────────────────────────────────────────
# LLM_DOM (default) — existing DOM-based scraping via Playwright + Claude vision
# NETWORK          — new network interception mode (intercepts XHR/fetch JSON responses)
aggregation.mode=LLM_DOM

# ── Network Aggregation ───────────────────────────────────────────────────────
# Pipe-separated URL substrings that hint at user-data endpoints
network.agg.url.keywords=users|accounts|members|identities|principals|people

# Pipe-separated JSON field names that hint at identity data
network.agg.identity.fields=email|username|displayName|userId|user_id|login|firstName|lastName

# Minimum records in a JSON array to qualify as user data
network.agg.min.records=5

# Automatically fall back to LLM_DOM if no qualifying network payload is found
network.agg.fallback.llm.dom=true

# Pipe-separated query-parameter names to check for page-number pagination detection
network.agg.pagination.params=page|offset|cursor|startIndex|start|pageToken

# Minimum response body length (chars) to be considered for scoring
network.agg.min.body.length=100

# Minimum score for a payload to qualify as user data (scoring algorithm in REQ-NA-11)
network.agg.qualifying.score=10

# HTTP connect timeout for direct pagination requests (ms)
network.agg.http.connect.timeout.ms=15000

# HTTP request timeout for direct pagination requests (ms)
network.agg.http.request.timeout.ms=30000

# Milliseconds to wait after AgentLoop completes before stopping the sniffer.
# SPAs (React/Angular/Vue) fire their user-data XHR calls asynchronously after
# the page shell renders. The agent issues DONE when it sees the page chrome,
# but the data XHR may still be in-flight. 3000ms covers most SPAs.
# Set to 0 to disable the wait (e.g. for server-rendered apps like Coupa).
network.agg.settle.after.done.ms=3000

# --- Eval Framework ---
# Path to benchmarks.json containing ground truth cases
eval.benchmarks.path=./src/main/resources/eval/benchmarks.json
# Directory where eval JSON reports are written
eval.output.dir=./eval-reports
# Set to true to skip the LLM judge (faster and cheaper — automated metrics only)
eval.skip.judge=false
