# Model configuration for the Stage 1 evaluation (video -> navigation goal).
#
# Loaded by EvalConfig.from_yaml in conftest.py.

# EvalConfig requires an `agent` block, but nothing here constructs an agent:
# the system under test is the Java pipeline, which runs separately and writes a
# JSON report that this harness reads. The block is set to the model the Java
# pipeline actually generates with, so the file records what produced the
# artifact being judged.
agent:
  model: "arn:aws:bedrock:us-east-1:406205545357:inference-profile/global.anthropic.claude-sonnet-4-6"
  temperature: 0
  max_tokens: 5000

# No `user` block. This is a workflow evaluation: one video in, one navigation
# goal out. There is no conversation for a user simulator to drive.

# Same model as the generator, which is a known weakness: a judge sharing the
# generator's blind spots will accept output a different model would reject.
# Scores here measure "did the goal match ground truth", not "is this model
# good"; treat cross-model disagreement as the real signal when it matters.
judge:
  model: "arn:aws:bedrock:us-east-1:406205545357:inference-profile/global.anthropic.claude-sonnet-4-6"
  temperature: 0
  max_tokens: 5000
