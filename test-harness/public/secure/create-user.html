<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create user — Demo Harness</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="appbar"><h1>Create user</h1><a href="/secure/dashboard.html">Dashboard</a></header>
  <main>
    <div class="card">
      <h2>Add new user</h2>
      <p class="subtitle">Auth-gated provisioning form — mirrors the real Google admin flow with token fields.</p>
      <form id="createForm" onsubmit="finish(event)">
        <div class="row">
          <div>
            <label for="firstName">First name *</label>
            <input type="text" id="firstName" name="firstName" aria-label="First name *" />
          </div>
          <div>
            <label for="lastName">Last name *</label>
            <input type="text" id="lastName" name="lastName" aria-label="Last name *" />
          </div>
        </div>
        <label for="primaryEmail">Primary email *</label>
        <input type="email" id="primaryEmail" name="primaryEmail" aria-label="Primary email *" />
        <div style="margin-top:18px;">
          <button type="submit" aria-label="Add new user">ADD NEW USER</button>
        </div>
      </form>
      <div id="done" class="done-banner" style="display:none;margin-top:18px;">User created successfully.</div>
    </div>
  </main>
  <script>
    function finish(e){e.preventDefault();document.getElementById('done').style.display='block';}
  </script>
</body>
</html>
