<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><link rel="stylesheet" href="/styles.css" />
</head>
<body style="background:transparent">
  <div style="padding:14px;border:2px dashed #b7c4de;border-radius:8px;margin:10px;">
    <p class="status" style="margin-top:0">Inner frame (depth 2)</p>
    <label for="pin">Security PIN</label>
    <input type="text" id="pin" aria-label="Security PIN" />
    <div style="margin-top:12px;"><button onclick="document.getElementById('ok').style.display='block'">Verify PIN</button></div>
    <div id="ok" class="done-banner" style="display:none;margin-top:12px;">PIN verified in nested frame.</div>
  </div>
</body>
</html>
