<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Destination — Scale</title><link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="appbar"><h1>Session established</h1><a href="/">Catalog</a></header>
  <main><div class="card">
    <div class="done-banner">Redirect chain complete — this is the real form.</div>
    <h2 style="margin-top:16px;">Access request</h2>
    <label for="res">Resource name</label>
    <input type="text" id="res" aria-label="Resource name" />
    <label for="just">Justification</label>
    <input type="text" id="just" aria-label="Justification" />
    <div style="margin-top:18px;"><button onclick="document.getElementById('ok').style.display='block'">Request access</button></div>
    <div id="ok" class="done-banner" style="display:none;margin-top:16px;">Access requested.</div>
  </div></main>
</body>
</html>
