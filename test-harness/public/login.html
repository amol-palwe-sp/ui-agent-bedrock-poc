<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Demo Harness</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="appbar"><h1>Demo Harness</h1><a href="/">Catalog</a></header>
  <main>
    <div class="card" style="max-width:420px;margin:40px auto;">
      <h2>Sign in</h2>
      <p class="subtitle">Fixture credentials: <code>test.user@demo.local</code> / <code>Demo!Pass123</code></p>
      <p id="err" class="gap-note" style="display:none;">Invalid email or password.</p>
      <form method="POST" action="/login" id="loginForm">
        <input type="hidden" name="redirect" id="redirect" value="" />
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" placeholder="you@demo.local" />
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Password" />
        <div style="margin-top:18px;">
          <button type="submit" id="signInBtn">Sign in</button>
        </div>
      </form>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get('error')) document.getElementById('err').style.display = 'block';
    if (params.get('redirect')) document.getElementById('redirect').value = params.get('redirect');
  </script>
</body>
</html>
