<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Custom combobox — Fields</title><link rel="stylesheet" href="/styles.css" />
  <style>.combo{position:relative;max-width:320px}.combo .control{border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:#fff}
  .combo ul{list-style:none;margin:4px 0 0;padding:4px;border:1px solid var(--line);border-radius:8px;position:absolute;left:0;right:0;background:#fff;z-index:5;display:none}
  .combo.open ul{display:block}.combo li{padding:8px 10px;border-radius:6px;cursor:pointer}.combo li:hover{background:#eef2fb}</style>
</head>
<body>
  <header class="appbar"><h1>Custom combobox</h1><a href="/">Catalog</a></header>
  <main><div class="card">
    <h2>Listbox combobox <span class="pill ok">Pass</span></h2>
    <p class="subtitle">Non-native dropdown with <code>role=option</code> items.</p>
    <label id="lbl">Team</label>
    <div class="combo" id="c">
      <div class="control" role="combobox" aria-expanded="false" aria-labelledby="lbl" tabindex="0" onclick="t()">Select a team…</div>
      <ul role="listbox" aria-label="Team">
        <li role="option" onclick="p('Engineering')">Engineering</li>
        <li role="option" onclick="p('Finance')">Finance</li>
        <li role="option" onclick="p('Marketing')">Marketing</li>
      </ul>
    </div>
    <div style="margin-top:16px;"><button onclick="ok.style.display='block'">Save</button></div>
    <div id="ok" class="done-banner" style="display:none;margin-top:14px;">Saved.</div>
  </div></main>
  <script>const c=document.getElementById('c');function t(){c.classList.toggle('open')}function p(v){c.querySelector('.control').textContent=v;c.classList.remove('open')}</script>
</body>
</html>
