<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>File upload — Fields</title><link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="appbar"><h1>File upload</h1><a href="/">Catalog</a></header>
  <main><div class="card">
    <div class="gap-note"><strong>Roadmap gap:</strong> the OS file chooser can't be driven by CLICK; Playwright's <code>setInputFiles</code> is not exposed as an agent action.</div>
    <h2>Attachment <span class="pill gap">Roadmap gap</span></h2>
    <label for="f">Attachment</label>
    <input type="file" id="f" aria-label="Attachment" onchange="document.getElementById('n').textContent=this.files[0]?this.files[0].name:''" />
    <p id="n" class="status"></p>
    <div style="margin-top:16px;"><button onclick="ok.style.display='block'">Save</button></div>
    <div id="ok" class="done-banner" style="display:none;margin-top:14px;">Saved.</div>
  </div></main>
</body>
</html>
