<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OTP input — Fields</title><link rel="stylesheet" href="/styles.css" />
  <style>.otp{display:flex;gap:10px}.otp input{width:48px;text-align:center;font-size:20px}</style>
</head>
<body>
  <header class="appbar"><h1>Segmented OTP</h1><a href="/">Catalog</a></header>
  <main><div class="card">
    <h2>One box per digit <span class="pill warn">Ladder</span></h2>
    <p class="subtitle">Six single-character inputs — six sequential TYPE actions.</p>
    <label>Verification code</label>
    <div class="otp">
      <input maxlength="1" aria-label="Digit 1" /><input maxlength="1" aria-label="Digit 2" />
      <input maxlength="1" aria-label="Digit 3" /><input maxlength="1" aria-label="Digit 4" />
      <input maxlength="1" aria-label="Digit 5" /><input maxlength="1" aria-label="Digit 6" />
    </div>
    <div style="margin-top:16px;"><button onclick="ok.style.display='block'">Verify</button></div>
    <div id="ok" class="done-banner" style="display:none;margin-top:14px;">Verified.</div>
  </div></main>
  <script>document.querySelectorAll('.otp input').forEach((el,i,a)=>el.addEventListener('input',()=>{if(el.value&&a[i+1])a[i+1].focus();}));</script>
</body>
</html>
