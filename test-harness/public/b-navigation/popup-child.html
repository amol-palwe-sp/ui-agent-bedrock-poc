<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Helper window</title><link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="appbar"><h1>Helper window</h1></header>
  <main><div class="card">
    <h2>Enter code</h2>
    <label for="code">Code</label>
    <input type="text" id="code" aria-label="Code" />
    <div style="margin-top:16px;"><button onclick="ok.style.display='block'">Apply</button></div>
    <div id="ok" class="done-banner" style="display:none;margin-top:14px;">Applied in popup.</div>
  </div></main>
</body>
</html>
