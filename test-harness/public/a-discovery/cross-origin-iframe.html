<body>
  <header class="appbar"><h1>Cross-origin iframe</h1><a href="/">Catalog</a></header>
  <main>
    <div class="card">
      <div class="gap-note"><strong>Roadmap gap (expected-fail):</strong> the form is served from a different origin
        (<code>http://localhost:4600</code>). The scraper only reads same-origin <code>iframe.contentDocument</code>,
        so these controls are invisible to the agent.</div>
      <h2>Embedded cross-origin form <span class="pill gap">Roadmap gap</span></h2>
      <iframe src="http://localhost:4600/a-discovery/frame-child.html" title="Cross-origin form"
              style="width:100%;height:220px;border:1px solid var(--line);border-radius:8px;"></iframe>
    </div>
  </main>
