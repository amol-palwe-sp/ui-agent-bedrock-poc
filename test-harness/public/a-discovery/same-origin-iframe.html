<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Same-origin iframe — Discovery</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="appbar"><h1>Same-origin iframe</h1><a href="/">Catalog</a></header>
  <main>
    <div class="card">
      <h2>Embedded same-origin form <span class="pill ok">Pass</span></h2>
      <p class="subtitle">The form lives in a same-origin <code>&lt;iframe&gt;</code>. The scraper reads <code>iframe.contentDocument</code>, so these controls are discoverable.</p>
      <iframe src="/a-discovery/frame-child.html" title="Embedded form" style="width:100%;height:220px;border:1px solid var(--line);border-radius:8px;"></iframe>
    </div>
  </main>
