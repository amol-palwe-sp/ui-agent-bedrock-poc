<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Semantic form — Discovery</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="appbar"><h1>Semantic form</h1><a href="/">Catalog</a></header>
  <main>
    <div class="card">
      <h2>Baseline sign-in <span class="pill ok">Pass</span></h2>
      <p class="subtitle">Plain semantic <code>&lt;input&gt;</code>/<code>&lt;button&gt;</code> with labels. Should be rock-solid.</p>
      <form onsubmit="done(event)">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" />
        <label for="password">Password</label>
        <input type="password" id="password" name="password" />
        <div style="margin-top:18px;"><button type="submit">Sign in</button></div>
      </form>
      <div id="ok" class="done-banner" style="display:none;margin-top:16px;">Signed in.</div>
    </div>
  </main>
  <script>function done(e){e.preventDefault();document.getElementById('ok').style.display='block';}</script>
</body>
</html>
